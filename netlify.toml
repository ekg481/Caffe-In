# Netlify configuration for Caffe In Coffee Co.
#
# Works two ways with no changes:
#   • Drag-and-drop (Netlify Drop) — the build section is ignored, the headers
#     below are still applied.
#   • Linked to this Git repo — there is nothing to build, so Netlify just
#     publishes the repo root.
#
# NOTE: a Git-linked site deploys the PRODUCTION BRANCH, which defaults to
# `main`. The site files have to be on whichever branch is set there, or the
# deploy has nothing to publish and Netlify skips it.

[build]
  publish = "."

# Publish non-production branches the same way, for when branch deploys or
# deploy previews are turned on in the Netlify UI.
[context.branch-deploy]
  publish = "."

[context.deploy-preview]
  publish = "."

# ---------------------------------------------------------------------------
# Caching
#
# The CSS and JS filenames are not content-hashed, so they must never be cached
# hard — Netlify serves ETags, so revalidation is a cheap 304 and an edit shows
# up immediately. The font files never change, so they get the long cache.
# ---------------------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    # Self-hosted fonts and no inline scripts, so this stays tight. Inline
    # style attributes are set from JS (gradients, animation delays), hence
    # 'unsafe-inline' on styles only. The image host is the shop's Google
    # listing photos — drop it if you move to self-hosted photos.
    Content-Security-Policy = "default-src 'self'; img-src 'self' https://lh3.googleusercontent.com data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
